version: '3.8'

services:
  # MinIO S3-compatible Storage (for file uploads)
  minio:
    image: minio/minio:latest
    container_name: guruapp-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - guruapp-network
    restart: unless-stopped

  # Ollama - Local AI Models
  ollama:
    image: ollama/ollama:latest
    container_name: guruapp-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    # GPU support (uncomment jika punya NVIDIA GPU)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - guruapp-network
    restart: unless-stopped

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guruapp-app
    environment:
      # Supabase Cloud (RECOMMENDED - setup at supabase.com)
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}

      # OpenAI / Ollama
      OPENAI_API_KEY: ${OPENAI_API_KEY:-ollama}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://ollama:11434/v1}
      MODEL_NAME: ${MODEL_NAME:-llama3.1:8b}

      # App
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      minio:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - guruapp-network
    restart: unless-stopped

  # Nginx Reverse Proxy + SSL
  nginx:
    image: nginx:alpine
    container_name: guruapp-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - guruapp-network
    restart: unless-stopped

  # Certbot untuk SSL Let's Encrypt (optional, for real domain)
  certbot:
    image: certbot/certbot:latest
    container_name: guruapp-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"
    networks:
      - guruapp-network
    profiles: ["ssl"]  # Only run with: docker-compose --profile ssl up -d

volumes:
  minio_data:
  ollama_data:

networks:
  guruapp-network:
    driver: bridge